<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    TRT monogram — brand crimson #DC143C, transparent bg.
    Single <text> with tight letter-spacing for legibility at 16px.
    Offset shadow copy (+2px) adds depth at 32px+.
    Readable at 16x16, clean at 32x32, strong at 180x180 (apple-touch).
  -->
  <!-- depth layer -->
  <text
    x="3" y="50"
    font-family="'Arial Black', 'Impact', 'Haettenschweiler', sans-serif"
    font-weight="900"
    font-size="42"
    letter-spacing="-6"
    fill="#8B0A20"
  >TRT</text>
  <!-- foreground -->
  <text
    x="1" y="48"
    font-family="'Arial Black', 'Impact', 'Haettenschweiler', sans-serif"
    font-weight="900"
    font-size="42"
    letter-spacing="-6"
    fill="#DC143C"
  >TRT</text>
</svg>
