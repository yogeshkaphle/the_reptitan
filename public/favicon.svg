<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    TRT monogram. viewBox 64x64 square.
    font-size 36 + letter-spacing -4 → ~60px total, 2px clear each side.
    Outer T's: off-white #F2F0EB. Middle R: crimson #DC143C.
    Single <text> with tspans keeps browser text-shaping intact → legible at 16px.
    Shadow dropped: two fill colors × shadow = 4 elements, muddy at 16px.
  -->
  <text
    x="32" y="32"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Arial Black', Impact, 'Haettenschweiler', sans-serif"
    font-weight="900"
    font-size="36"
    letter-spacing="-4"
  ><tspan fill="#F2F0EB">T</tspan><tspan fill="#DC143C">R</tspan><tspan fill="#F2F0EB">T</tspan></text>
</svg>
